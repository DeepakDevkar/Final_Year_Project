<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas – Live Map Background</title>

<!-- Leaflet: free, open-source map library -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<style>
  :root {
    --panel: rgba(255, 253, 248, .94);
    --ink: #1d2b36;
    --muted: #5b6b77;
    --accent: #0b6e6e;
    --line: #d9d4c7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: var(--ink); }

  /* The real map fills the whole page, behind everything */
  #map { position: fixed; inset: 0; z-index: 0; }

  /* Website content floats above the map */
  .ui { position: relative; z-index: 1000; pointer-events: none; min-height: 100%; }
  .ui > * { pointer-events: auto; }

  header {
    position: fixed; top: 16px; left: 16px; right: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 16px; backdrop-filter: blur(6px);
  }
  .brand { font-weight: 700; font-size: 1.15rem; letter-spacing: .02em; color: var(--accent); }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 7px 12px; border-radius: 6px; font: inherit; font-size: .9rem; cursor: pointer;
  }
  nav button:hover { border-color: var(--accent); }
  nav button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 3px solid #e0a800; outline-offset: 2px; }

  .card {
    position: fixed; left: 16px; bottom: 28px; width: min(360px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; backdrop-filter: blur(6px);
  }
  .card h1 { margin: 0 0 6px; font-size: 1.45rem; line-height: 1.2; }
  .card p { margin: 0 0 14px; color: var(--muted); line-height: 1.5; font-size: .95rem; }
  .search { display: flex; gap: 8px; }
  .search input {
    flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid var(--line);
    border-radius: 6px; font: inherit; background: #fff;
  }
  .search button {
    padding: 9px 14px; border: 0; border-radius: 6px; background: var(--accent);
    color: #fff; font: inherit; cursor: pointer;
  }
  .status { margin-top: 10px; min-height: 1.2em; font-size: .85rem; color: var(--muted); }
  .coords { margin-top: 4px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  @media (max-width: 560px) {
    header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div id="map" aria-label="Interactive world map"></div>

<div class="ui">
  <header>
    <span class="brand">Atlas</span>
    <nav aria-label="Map style">
      <button data-style="street" aria-pressed="true">Street</button>
      <button data-style="topo" aria-pressed="false">Terrain</button>
      <button data-style="light" aria-pressed="false">Light</button>
      <button id="locate" aria-pressed="false">My location</button>
    </nav>
  </header>

  <section class="card">
    <h1>Explore the real world map</h1>
    <p>This page sits on a live, interactive map. Drag to pan, scroll to zoom, or search for any place.</p>
    <form class="search" id="searchForm">
      <input id="q" type="search" placeholder="Search a city or address" aria-label="Search a place">
      <button type="submit">Search</button>
    </form>
    <div class="status" id="status" role="status"></div>
    <div class="coords" id="coords">Move the cursor over the map</div>
  </section>
</div>

<script>
  // ---- Map setup (starts centered on Pune, India) ----
  const map = L.map('map', { zoomControl: false }).setView([18.5204, 73.8567], 12);
  L.control.zoom({ position: 'topright' }).addTo(map);
  // Keep zoom control clear of the fixed header
  document.querySelector('.leaflet-top.leaflet-right').style.top = '80px';

  // Free tile providers (no API key needed)
  const layers = {
    street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }),
    topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17, attribution: 'Map data &copy; OpenStreetMap contributors, SRTM | Style &copy; <a href="https://opentopomap.org">OpenTopoMap</a>'
    }),
    light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 20, subdomains: 'abcd', attribution: '&copy; OpenStreetMap contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
    })
  };
  let current = layers.street.addTo(map);

  // ---- Style switcher ----
  document.querySelectorAll('nav [data-style]').forEach(btn => {
    btn.addEventListener('click', () => {
      map.removeLayer(current);
      current = layers[btn.dataset.style].addTo(map);
      document.querySelectorAll('nav [data-style]').forEach(b => b.setAttribute('aria-pressed', b === btn));
    });
  });

  // ---- Marker helper ----
  let marker;
  function drop(lat, lng, label) {
    if (marker) map.removeLayer(marker);
    marker = L.marker([lat, lng]).addTo(map).bindPopup(label).openPopup();
  }

  // ---- Search via Nominatim (free OpenStreetMap geocoder) ----
  const status = document.getElementById('status');
  document.getElementById('searchForm').addEventListener('submit', async e => {
    e.preventDefault();
    const q = document.getElementById('q').value.trim();
    if (!q) return;
    status.textContent = 'Searching…';
    try {
      const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
      const data = await res.json();
      if (!data.length) { status.textContent = 'No place found. Try a different name.'; return; }
      const p = data[0];
      map.flyTo([+p.lat, +p.lon], 13, { duration: 1.5 });
      drop(+p.lat, +p.lon, p.display_name);
      status.textContent = 'Showing: ' + p.display_name;
    } catch (err) {
      status.textContent = 'Search failed. Check your internet connection.';
    }
  });

  // ---- Geolocation ----
  document.getElementById('locate').addEventListener('click', () => {
    if (!navigator.geolocation) { status.textContent = 'Location is not supported in this browser.'; return; }
    status.textContent = 'Finding your location…';
    navigator.geolocation.getCurrentPosition(pos => {
      const { latitude, longitude } = pos.coords;
      map.flyTo([latitude, longitude], 15, { duration: 1.5 });
      drop(latitude, longitude, 'You are here');
      status.textContent = 'Location found.';
    }, () => { status.textContent = 'Location blocked. Allow access in your browser settings.'; });
  });

  // ---- Live coordinates ----
  const coords = document.getElementById('coords');
  map.on('mousemove', e => {
    coords.textContent = e.latlng.lat.toFixed(4) + ', ' + e.latlng.lng.toFixed(4);
  });
</script>
</body>
</html>
